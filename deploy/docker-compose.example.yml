services:
  orbinum-web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: orbinum-web
    restart: unless-stopped
    environment:
      ORBINUM_WEB_HOST: 0.0.0.0
      ORBINUM_WEB_PORT: "8787"
      ORBINUM_DB: /data/uptime.db
      ORBINUM_VALIDATOR_NAME: robotek8-orbinum
    volumes:
      - /var/lib/orbinum-monitor:/data:ro
      - /opt/orbinum-monitor/static:/app/static:ro
    expose:
      - "8787"
