name: Orbinum Watcher tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  passive-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: |
          python -m py_compile \
            bot.py \
            agent/linux_ops_bot.py \
            agent/windows_telemetry.py \
            agent/windows_event_sync.py \
            analysis/anomaly_detector.py \
            analysis/stress_event_report.py \
            tests/synthetic_replay.py \
            tests/stress_event_report_replay.py
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }
      - name: Synthetic anomaly replay
        run: python tests/synthetic_replay.py
      - name: Stress-event replay
        run: python tests/stress_event_report_replay.py
      - name: Telegram button UI replay
        run: python tests/bot_ui_replay.py
      - name: Linux ops bot replay
        run: python tests/linux_ops_bot_replay.py
